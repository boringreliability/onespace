<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>oneSpace</title>
    <meta name="description" content="A procedurally generated noir space odyssey." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      :root {
        color-scheme: dark;
        --ui-amber: #ffb454;
        --ui-cyan: #5fd7e0;
        --ui-dim: #6b7a85;
        --ui-warn: #ff5f56;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #cfd8dc;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas#gl { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Boot / loading veil ------------------------------------------------ */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: radial-gradient(ellipse at 50% 55%, #0a0f14 0%, #000 70%);
        transition: opacity 1.2s ease 0.2s, visibility 0s linear 1.4s;
      }
      #boot.hidden { opacity: 0; visibility: hidden; }
      #boot .title {
        font-size: clamp(2rem, 7vw, 4.5rem);
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        font-weight: 300;
        color: #e8eef2;
        text-shadow: 0 0 40px rgba(95, 215, 224, 0.35);
      }
      #boot .sub {
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        color: var(--ui-dim);
        text-transform: uppercase;
      }
      #boot .bar {
        width: min(340px, 60vw);
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        position: relative;
        overflow: hidden;
      }
      #boot .bar > i {
        position: absolute;
        inset: 0 100% 0 0;
        background: linear-gradient(90deg, transparent, var(--ui-cyan));
        transition: right 0.35s ease;
      }
      #boot .status {
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        color: var(--ui-dim);
        min-height: 1em;
      }
      #boot .hint {
        margin-top: 1.5rem;
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        color: #3d4a53;
      }
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        padding: 2rem;
        background: #050708;
        color: var(--ui-warn);
        font-size: 0.8rem;
        white-space: pre-wrap;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui-root"></div>
    </div>

    <div id="boot">
      <div class="title">ONESPACE</div>
      <div class="sub">a noir odyssey</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="status" id="boot-status">initialising</div>
      <div class="hint">click to engage</div>
    </div>

    <pre id="fatal"></pre>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
